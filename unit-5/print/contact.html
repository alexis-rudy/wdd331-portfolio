<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Contact</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="contact.css"> 
</head>
<body>
	<header>
		<h1>Contact Me</h1>
		<p>Have a question or want to get in touch? Send me a message.</p>
	</header>

	<main>
		<form action="#" method="post">
			<p>
				<label for="name">Name</label><br>
				<input type="text" id="name" name="name" autocomplete="name" required>
			</p>
			<p>
				<label for="email">Email</label><br>
				<input type="email" id="email" name="email" autocomplete="email" required>
			</p>
			<p>
				<label for="phone">Phone number</label><br>
				<input type="tel" id="phone" name="phone" autocomplete="tel">
			</p>
			<fieldset>
				<legend>How do you prefer to be contacted?</legend>
				<label>
					<input type="radio" name="preferred-contact" value="text" required>
					Text message
				</label>
				<label>
					<input type="radio" name="preferred-contact" value="email">
					Email
				</label>
			</fieldset>
			<p>
				<label for="message">Message</label><br>
				<textarea id="message" name="message" required></textarea>
			</p>
			<button type="submit">Send message</button>
		</form>
	</main>
</body>
</html>
